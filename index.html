<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>奇幻冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1610; --panel:#2b2117; --panel2:#3a2d1f; --line:#7a6040; --ink:#f1e4c8; --dim:#b9a582;
  --gold:#e8c068; --red:#d9573f; --green:#7fb069; --blue:#6aa2d8; --purple:#a77fd1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",sans-serif;font-size:15px}
body{display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
button{font-family:inherit;font-size:14px;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:4px;padding:7px 10px;cursor:pointer;image-rendering:pixelated}
button:hover:not(:disabled){background:#4a3a28;border-color:var(--gold)}
button:disabled{opacity:.4;cursor:default}
button.primary{border-color:var(--gold);color:var(--gold)}
#app{width:100%;max-width:980px;padding:8px;display:flex;flex-direction:column;gap:8px}
#topbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:6px 10px}
#clock{font-weight:700;color:var(--gold)}
#main{display:flex;gap:8px;align-items:flex-start}
#mapwrap{flex:1;min-width:0;background:#000;border:2px solid var(--line);border-radius:6px;position:relative}
canvas{display:block;width:100%;image-rendering:pixelated;touch-action:none}
#side{width:300px;display:flex;flex-direction:column;gap:6px}
#party{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pc{background:var(--panel);border:2px solid var(--line);border-radius:5px;padding:4px 6px;font-size:12px;line-height:1.35}
.pc .nm{font-weight:700;font-size:13px}
.bar{height:5px;background:#000;border-radius:2px;overflow:hidden;margin:2px 0}
.bar i{display:block;height:100%}
.hp i{background:var(--red)} .mp i{background:var(--blue)}
.st{font-size:11px;color:var(--dim)}
.bad{color:var(--red)} .good{color:var(--green)}
#actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
#log{background:var(--panel);border:2px solid var(--line);border-radius:5px;padding:6px;height:120px;overflow-y:auto;font-size:12.5px;line-height:1.5}
#dpad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:4px;justify-content:center}
#dpad button{font-size:18px;padding:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}
#modal{z-index:30}
.overlay.show{display:flex}
.win{background:var(--panel);border:3px solid var(--gold);border-radius:8px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:14px}
.win h2{margin:0 0 8px;color:var(--gold);font-size:19px}
.win h3{margin:12px 0 6px;font-size:15px;color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.list{display:flex;flex-direction:column;gap:5px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:13px}
.item small{color:var(--dim)}
.close{float:right}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border:1px solid var(--line);padding:4px 6px;text-align:left}
th{color:var(--gold);background:var(--panel2)}
/* battle */
#battle .win{max-width:760px;border-color:var(--red)}
#enemies{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:140px;background:#120d08;border:2px solid var(--line);border-radius:6px;padding:10px}
.en{text-align:center;font-size:12px;cursor:pointer;padding:4px;border:2px solid transparent;border-radius:6px}
.en.target{border-color:var(--gold)}
.en.dead{opacity:.25;cursor:default}
.en canvas{width:72px;height:72px;margin:0 auto}
#bparty{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
#bparty .pc.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
#bparty .pc.pick{cursor:pointer;border-color:var(--green)}
#bcmd{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
#blog{margin-top:8px;background:#120d08;border:2px solid var(--line);border-radius:6px;padding:6px;height:110px;overflow-y:auto;font-size:13px;line-height:1.5}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--panel2);border:2px solid var(--gold);padding:8px 14px;border-radius:6px;z-index:40;display:none}
@media (max-width:760px){
  #main{flex-direction:column;align-items:stretch}
  #side{width:100%}
  #party{grid-template-columns:repeat(3,1fr)}
  #dpad{display:grid}
  #log{height:90px}
}

.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
button.mini{padding:2px 6px;font-size:12px;border-width:1px}
.eqrow{display:flex;flex-wrap:wrap;gap:4px 12px}
.en.boss canvas{width:104px;height:104px}
.pc.stopped{opacity:.6;border-style:dashed}
select{font-family:inherit;font-size:13px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px}
#actions{grid-template-columns:repeat(3,1fr)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="clock">—</span>
    <span id="gold">—</span>
    <span id="hint" class="st"></span>
  </div>
  <div id="main">
    <div id="mapwrap"><canvas id="map" width="600" height="600"></canvas></div>
    <div id="side">
      <div id="party"></div>
      <div id="actions">
        <button id="btnParty">隊伍 (P)</button>
        <button id="btnCamp">紮營 (C)</button>
        <button id="btnEnter">進入 (E)</button>
        <button id="btnJournal">日誌 (J)</button>
        <button id="btnMap">地圖 (M)</button>
        <button id="btnFamily">家譜 (H)</button>
        <button id="btnSave">存檔</button>
        <button id="btnLoad">讀檔</button>
        <button id="btnMusic">音樂：關</button>
      </div>
      <div id="dpad">
        <span></span><button data-d="0,-1">▲</button><span></span>
        <button data-d="-1,0">◀</button><button id="btnWait" title="原地休息 1 小時">・</button><button data-d="1,0">▶</button>
        <span></span><button data-d="0,1">▼</button><span></span>
      </div>
      <div id="log"></div>
    </div>
  </div>
</div>
<div class="overlay" id="modal"><div class="win" id="modalWin"></div></div>
<div class="overlay" id="battle"><div class="win">
  <div class="row" style="justify-content:space-between">
    <h2 id="btitle" style="margin:0">戰鬥</h2>
    <div class="row"><button id="bAuto">自動：關 (空白鍵)</button><button id="bSpeed">速度：1x</button></div>
  </div>
  <div id="enemies" style="margin-top:8px"></div>
  <div id="bparty"></div>
  <div id="bcmd"></div>
  <div id="blog"></div>
</div></div>
<div class="toast" id="toast"></div>
